<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style type="text/tailwindcss">
        @theme {
            --color-nvidia: #76B900;
            --color-oblack: #1E1E1E;
        }
    </style>

  </head>
  <body class="bg-[url('background-nvidia.jpg')] bg-cover bg-center bg-fixed min-h-screen">
    <nav class="bg-nvidia text-white p-4">
      <div class="container mx-auto flex justify-between items-center">
        <a href="index.html" class="flex items-center">
            <img 
                src="NVIDIA_logo.svg.png" 
                alt="NVIDIA Logo" 
                class="h-8 w-auto object-contain brightness-0 invert" 
            />
        </a>


        <ul class="flex space-x-4 font-bold">
          <li><a href="products.html" class="hover:underline">Products</a></li>
          <li><a href="support.html" class="hover:underline">Support</a></li>
        </ul>
      </div>
    </nav>

    <form action="#success" class="mt-12 mx-auto max-w-2xl px-4 bg-black bg-opacity-70 p-8 rounded-lg shadow-lg text-white">
        <h2 class="text-2xl font-bold mb-6">Submit a Support Ticket</h2>
        
        <div class="mb-4">
            <label for="name" class="block mb-2 font-bold">Name</label>
            <input type="text" id="name" name="name" required class="w-full p-2 rounded bg-neutral-800 text-white border border-gray-700 focus:outline-none focus:ring focus:ring-nvidia">
        </div>

        <div class="mb-4">
            <label for="email" class="block mb-2 font-bold">Email</label>
            <input type="email" id="email" name="email" required class="w-full p-2 rounded bg-neutral-800 text-white border border-gray-700 focus:outline-none focus:ring focus:ring-nvidia">
        </div>

        <div class="mb-4">
            <label for="issue" class="block mb-2 font-bold">Issue Description</label>
            <textarea id="issue" name="issue" rows="5" required class="w-full p-2 rounded bg-neutral-800 text-white border border-gray-700 focus:outline-none focus:ring focus:ring-nvidia"></textarea>
        </div>

        <button type="submit" class="bg-nvidia hover:bg-green-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring focus:ring-nvidia">Submit Ticket</button>
    </form>

    <div id="success" class="hidden target:flex fixed inset-0 z-50 items-center justify-center bg-black/70">
        <div class="bg-oblack text-white rounded-lg p-8 max-w-sm text-center shadow-lg">
            <h3 class="text-xl font-bold mb-2">Ticket submitted</h3>
            <p class="mb-6">Thanks! Our support team will get back to you soon.</p>
            <a href="#" class="inline-block bg-nvidia text-white font-bold px-4 py-2 rounded">Close</a>
        </div>
    </div>

    <footer class="border-t border-white/20 py-6 text-center text-sm text-neutral-400">
        <span>&copy; 2026 NVIDIA Corporation. All rights reserved.</span>
    </footer>

  </body>
  </html>
